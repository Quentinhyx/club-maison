<!doctype html><html><body><pre id="out">...</pre>
<script type="module">
import { getDemoBuffer, computeWaveformAsync, prewarmDemo, renderDemoPcm, SynthDeck, listDemoTracks } from '../index.ts';
const out = document.getElementById('out');
let maxGap = 0, last = performance.now(), on = true;
function frame(t) { const g = t - last; if (g > maxGap) maxGap = g; last = t; if (on) requestAnimationFrame(frame); }
async function measure(fn) { await new Promise(r => requestAnimationFrame(r)); maxGap = 0; last = performance.now(); on = true; requestAnimationFrame(frame); const t0 = performance.now(); const v = await fn(); const ms = performance.now() - t0; await new Promise(r => setTimeout(r, 50)); return { v, ms, maxGap }; }
(async () => {
  try {
    const ctx = new AudioContext();
    const idle = await measure(() => new Promise(r => setTimeout(r, 1500)));
    const t1 = performance.now(); const tmp = ctx.createBuffer(2, 240*44100, 44100); tmp.getChannelData(0).set(new Float32Array(240*44100)); const copyMs = performance.now() - t1;
    const a = await measure(() => getDemoBuffer(-1001, ctx));
    const b = await measure(() => computeWaveformAsync(a.v, 150));
    const c = await measure(() => prewarmDemo([-1012, -1021], ctx));
    const d = await measure(() => getDemoBuffer(-1012, ctx)); // déjà en cache
    const deck = new SynthDeck('A', ctx);
    const e = await measure(() => deck.load(listDemoTracks().find(t => t.id === -1005), 30));
    const sync = await measure(async () => renderDemoPcm(-1006, 44100));
    let peak = 0; const ch = a.v.getChannelData(0); for (let i = 0; i < ch.length; i += 7) peak = Math.max(peak, Math.abs(ch[i]));
    window.__result = {
      idle: { maxGap: idle.maxGap }, copyMs,
      buffer: { ms: a.ms, maxGap: a.maxGap, duration: a.v.duration, channels: a.v.numberOfChannels, peak },
      waveform: { ms: b.ms, maxGap: b.maxGap, points: b.v.low.length },
      prewarm: { ms: c.ms, maxGap: c.maxGap }, cached: { ms: d.ms },
      deckLoad: { ms: e.ms, maxGap: e.maxGap, state: deck.getState().status, pos: deck.getState().position },
      syncReference: { ms: sync.ms, maxGap: sync.maxGap },
    };
  } catch (err) { window.__result = { error: String(err && err.stack || err) }; }
  out.textContent = JSON.stringify(window.__result, null, 1);
})();
</script></body></html>
